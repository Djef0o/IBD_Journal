# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# JDK for Gradle: the system's JDK (17 or newer, with javac).
# Cache dependencies and task outputs between builds
org.gradle.caching=true
# AndroidX is the default in AGP 9
android.useAndroidX=true
# Non-transitive R classes for faster builds
android.nonTransitiveRClass=true
